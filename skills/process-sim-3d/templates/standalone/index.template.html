<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Simulation</title>
<style>
:root{--panel:rgba(12,16,22,.80);--panel2:rgba(255,255,255,.045);--line:rgba(255,255,255,.10);--tx:#e9eef3;--mut:#93a0b1;--dim:#5d6878;
  --amber:#ffb020;--red:#ff4a33;--cyan:#35c9ff;--green:#3ee07c;--blue:#5aa4ff;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfd6da;color:var(--tx);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input{font:inherit;color:inherit}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
#left{position:fixed;left:14px;top:14px;bottom:118px;width:292px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#left>*{pointer-events:auto}
#title{padding:12px 14px}#title h1{margin:2px 0 3px;font-size:16px;font-weight:650}#title p{margin:0;color:var(--mut);font-size:11.5px}
#flow{padding:10px 8px 8px;min-height:0;display:flex;flex-direction:column}
#steps{list-style:none;margin:0;padding:0;overflow:auto}
#steps li{display:grid;grid-template-columns:22px 1fr auto;gap:7px;align-items:center;padding:5px 6px;border-radius:8px;color:var(--mut)}
#steps li .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 10.5px var(--mono);color:var(--dim)}
#steps li b{display:block;font-weight:560;font-size:12.5px}#steps li small{display:none;font-size:11px}
#steps li.on{background:rgba(255,176,32,.10);color:var(--tx)}#steps li.on small{display:block}#steps li.on .n{border-color:var(--amber);color:var(--amber)}
#steps li.hot.on{background:rgba(255,74,51,.13)}#steps li.hot.on .n{border-color:var(--red);color:var(--red)}
.pill{width:8px;height:8px;border-radius:50%;background:var(--panel2)}li.on .pill{background:var(--amber);box-shadow:0 0 8px var(--amber)}
#log{padding:9px 12px;font-size:11px;color:var(--mut);max-height:120px;overflow:hidden}#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log .t{font-family:var(--mono);color:var(--dim);margin-right:6px}
#right{position:fixed;right:14px;top:14px;bottom:118px;width:318px;display:flex;flex-direction:column;gap:10px;overflow:auto;scrollbar-width:none}
.st{padding:11px 12px 12px}.st h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}.st h3 .phase{font:500 11px var(--mono);color:var(--amber)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}.counts div{background:var(--panel2);border-radius:8px;padding:6px 7px}
.counts b{display:block;font:600 16px var(--mono)}.counts small{color:var(--mut);font-size:10px}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 8px}.cells i{height:16px;border-radius:4px;background:var(--panel2)}
.cells i.busy{background:var(--red);box-shadow:0 0 6px var(--red)}.cells i.done{background:var(--green)}.cells i.loading,.cells i.cool{background:var(--cyan)}
.ut{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center;margin:4px 0;font-size:11px}.ub{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.ub i:nth-child(1){background:var(--green)}.ub i:nth-child(2){background:var(--amber)}.ub i:nth-child(3){background:#56606c}.ub i:nth-child(4){background:var(--cyan)}
.kpi{font-size:11px;color:var(--mut);margin-top:6px}.kpi b{color:var(--tx);font-family:var(--mono)}
#cfg summary{cursor:pointer;padding:10px 12px;font-weight:600}#cfgBody{padding:0 12px 12px}
.row{display:grid;grid-template-columns:1fr 70px;gap:6px;align-items:center;margin:6px 0}.row label{font-size:11.5px}.row small{display:block;color:var(--dim);font-size:10px}
.row input[type=number]{width:70px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:3px 5px;font:500 12px var(--mono)}
.row input[type=range]{grid-column:1/3;width:100%}.grp{margin-top:10px}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;padding:8px 10px;width:max-content;max-width:calc(100vw - 28px)}
.btn{border:0;background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--mut);font-weight:560}.btn:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.btn.on{background:rgba(255,255,255,.14);color:var(--tx)}.btn.pri{background:var(--amber);color:#1d1300}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:8px;padding:2px;gap:2px}.bgrp{display:flex;align-items:center;gap:6px}
.lbl{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}#clock{font:600 14px var(--mono);min-width:66px;text-align:center}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;font-weight:560;background:rgba(12,16,22,.78);color:#fff;border-radius:6px;padding:3px 7px}
.tag.big{font-size:12px;background:rgba(255,176,32,.92);color:#1d1300}
#caption{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);max-width:640px;padding:10px 16px;font-size:14px;text-align:center;display:none}
#caption.show{display:block}
#cmp{position:fixed;inset:0;z-index:8;display:none;place-items:center;background:rgba(6,9,13,.55);padding:18px}#cmp.show{display:grid}
#cmpBox{width:min(900px,100%);max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);min-height:0;display:flex;flex-direction:column}
#cmpHead{display:flex;justify-content:space-between;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#cmpBody{padding:8px 16px 16px;overflow:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
.ct{width:100%;border-collapse:collapse;font-size:12px}.ct th,.ct td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}.ct th:first-child{text-align:left}
body.walk .simOnly{display:none!important}
#err{position:fixed;inset:0;display:none;place-items:center;background:#11151b;color:#fff;text-align:center}
@media (max-width:820px){#flow,#log{display:none}#left{width:210px;bottom:auto}#right{width:230px;max-height:46vh}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D process simulation"></canvas>
<div id="labels"></div>
<div id="left">
  <div id="title" class="panel"><div class="eyebrow" id="sub">Process simulation</div><h1 id="h1"></h1><p id="subtitle"></p></div>
  <div id="flow" class="panel"><div class="eyebrow">End-to-end flow</div><ol id="steps"></ol></div>
  <div id="log" class="panel simOnly"></div>
</div>
<div id="right">
  <section class="st panel simOnly" id="card"></section>
  <details id="cfg" class="panel simOnly"><summary>Timing &amp; configuration</summary><div id="cfgBody"></div></details>
</div>
<div id="caption" class="panel"></div>
<div id="bar" class="panel">
  <button id="play" class="btn pri">Pause</button><button id="restart" class="btn">Restart</button><span id="clock">00:00</span>
  <div class="seg" id="speeds"></div>
  <div class="seg" id="views"></div>
  <span class="bgrp"><span class="lbl">Mode</span><div class="seg" id="mode"></div></span>
  <button id="compareBtn" class="btn pri simOnly">Compare</button>
  <span class="bgrp"><span class="lbl">Panels</span><div class="seg" id="encl"></div></span>
  <div class="seg"><button id="tLabels" class="btn on">Labels</button><button id="tAuto" class="btn">Auto-cam</button></div>
</div>
<div id="cmp"><div id="cmpBox" class="panel"><div id="cmpHead"><div><div class="eyebrow">Setup comparison</div><h2 id="cmpTitle" style="margin:2px 0;font-size:17px"></h2><p id="cmpNote" style="margin:0;color:var(--mut);font-size:11.5px"></p></div>
  <div><button id="cmpRun" class="btn">Re-run</button><button id="cmpClose" class="btn pri">Close</button></div></div><div id="cmpBody"></div></div></div>
<div id="err"><div><h2>WebGL is not available</h2><p>This simulation needs a browser with WebGL 2.</p></div></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
