# Fixture: a trunk-based monorepo with two tested backends, no test CI yet, and only find/groom/measure enabled.
version: 1
project: {repo: acme/shopfloor, environment_id: env_fixture, description: "Monorepo: two FastAPI backends and React frontends"}
branches: {integration: main, production: main}
hub: {issue: 7, marker: "<!-- SHOPFLOOR-HUB -->"}
approvers: [alice, bob]
wip: {limit: 3, prefixes: [groomed/]}
orient: {read_first: [CLAUDE.md, svc-a/CLAUDE.md]}
components:
  - {name: svc-a-backend, paths: ["svc-a/backend/**"], tests: ["svc-a/backend/tests/**/test_*.py"],
     static: ["ruff check svc-a/backend"], collect: "cd svc-a/backend && python -m pytest --collect-only -q {files}"}
  - {name: svc-b-backend, paths: ["svc-b/backend/**"], tests: ["svc-b/backend/tests/**/test_*.py"],
     static: ["ruff check svc-b/backend"], collect: "cd svc-b/backend && python -m pytest --collect-only -q {files}"}
risk: {t2: [".claude/**"], t2_tests: []}
routines:
  - {key: audit, prompt: local/audit.md, id: null, status: active, cron: "0 22 * * 0", model: claude-opus-5-5}
  - {key: backlog-groom, role: backlog-groom, id: null, status: active, cron: "30 23 * * 0-4", model: claude-opus-5-5}
  - {key: gated-implementer, role: gated-implementer, id: null, status: planned, cron: "0 1,4,7 * * 1-5",
     model: claude-opus-5-5, attribution: [{head: "groomed/*", base: main}]}
  - {key: scorecard, role: scorecard, id: null, status: active, cron: "30 1 * * 1", model: claude-sonnet-5-5}
